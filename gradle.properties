# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX package structure
android.useAndroidX=true

# Enable build cache
org.gradle.configuration-cache=true

# AGP 9.0 built-in Kotlin compatibility with KSP
android.disallowKotlinSourceSets=false

# R8 full mode: more aggressive optimization/shrinking than standard mode.
# Safe here because Hilt/Room/Serialization keep-rules are already in proguard-rules.pro.
android.enableR8.fullMode=true

# Strip unused resources referenced only by removed code paths.
android.nonFinalResIds=true
